environment:
  staging: false
  production: false
  local: true

project_params:
  name: cophieu68
  url: "https://cophieu68.vn"
  version: 1.0
  service_name: data-api-go
  description: "ELT pipeline config: ingest raw HTML/JSON, persist to MongoDB, transform, load to PostgreSQL"
  logger:
    level: INFO
    format: json
    retention_days: 14
    ingestion_log:
      cophieu68:
        level: INFO
        extract:
          level: INFO
          storage_path: logger_storage/ingestion/cophieu68
          max_size_mb: 50
          backup_count: 7
          files:
            debug: extract_debug.log
            info: extract_info.log
            warning: extract_warning.log
            error: extract_error.log
        load:
          level: INFO
          storage_path: logger_storage/ingestion/cophieu68
          max_size_mb: 50
          backup_count: 7
          files:
            debug: load_debug.log
            info: load_info.log
            warning: load_warning.log
            error: load_error.log
        transform:
          level: INFO
          storage_path: logger_storage/ingestion/cophieu68
          max_size_mb: 50
          backup_count: 7
          files:
            debug: transform_debug.log
            info: transform_info.log
            warning: transform_warning.log
            error: transform_error.log

    storage_log:
      mongodb:
        level: INFO
        storage_path: logger_storage/storage/mongodb
        max_size_mb: 50
        backup_count: 7
        files:
          debug: mongodb_debug.log
          info: mongodb_info.log
          warning: mongodb_warning.log
          error: mongodb_error.log
      postgresql:
        level: INFO
        storage_path: logger_storage/storage/postgresql
        max_size_mb: 50
        backup_count: 7
        files:
          debug: postgresql_debug.log
          info: postgresql_info.log
          warning: postgresql_warning.log
          error: postgresql_error.log

  security:
    encryption_key_path: internal/config/encryption.key
    secrets_backend: env
    rotate_secrets_days: 30
    ssh_tunnel: false

  http:
    delay_seconds: 0.3
    timeout_seconds: 30
    headers:
      User-Agent: "Mozilla/5.0 ..."
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
      Accept-Encoding: "gzip, deflate"
      Connection: "keep-alive"
      Upgrade-Insecure-Requests: "1"

  sources:
    cophieu68:
      base_url: "https://cophieu68.vn"
      endpoints:
        company_profile: "/quote/profile.php?id={symbol}"
        summary_financial: "/quote/summary.php?id={symbol}"
        financial_ratios: "/quote/financial.php?id={symbol}"
        power_rating: "/quote/summary.php?id={symbol}"
        financial_details_quarter: "/quote/financial_detail.php?id={symbol}&type=quarter"
        financial_details_year: "/quote/financial_detail.php?id={symbol}&type=year"
        market_list: "/market/markets.php"
        trading_data: "/quote/history.php?cP={page}&id={symbol}"
        stock_category:
          - "/category/category_index.php"
          - "/category/category_financial.php"
      rate_limit_per_minute: 60
      retry:
        max_attempts: 3
        backoff_seconds: 30
      parser: html
      auth: {}

  storage:

    postgreSQL:
      host: "localhost"
      port: 5432
      database: "etl_project"
      user: "hungpham"
      password: "hungpham@123"
      schema: "private"
      connection_pool:
        min_size: 1
        max_size: 10
      delay_call: 0.2
      reties_etl_flows:
        max_attempts: 3
        backoff_seconds: 60
    mongodb:
      enabled: true
      url: "mongodb://root:root123@localhost:27017/?authSource=admin"
      database: "cophieu68_datalake"
      username: "root"
      password: "root123"
      authSource: "admin"
      host: "localhost"
      port: 27017
      connectTimeoutMS: 5000
      maxPoolSize: 50
      retryWrites: true
      writeConcern: "majority"
      delay_call: 0.2
      reties_etl_flows:
        max_attempts: 3
        backoff_seconds: 60
      documentation:
        market_list:
          bsonType: object
          additionalProperties: true
        industry_info:
          bsonType: object
          additionalProperties: true
        company_info:
          bsonType: object
          additionalProperties: true
        match_details:
          bsonType: object
          additionalProperties: true
        financial_summary:
          bsonType: object
          additionalProperties: true
        business_plan:
          bsonType: object
          additionalProperties: true
        income_statement:
          bsonType: object
          additionalProperties: true
        balance_sheet:
          bsonType: object
          additionalProperties: true
        financial_info:
          bsonType: object
          additionalProperties: true
        trading_data:
          bsonType: object
          additionalProperties: true

  # Add under top-level key `data_warehouse_schema:` (merge into existing config)
  data_warehouse_schema:
    schema_name: "private"
    dimensions:
      dim_market_type:
        grain: "1 record per stock exchange"
        columns:
          market_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          market_type:
            type: "TEXT"
            constraints: "UNIQUE NOT NULL"
          market_name:
            type: "TEXT"
            constraints: ""
          update_time:
            type: "TIMESTAMPTZ"
            constraints: ""
          created_time:
            type: "TIMESTAMPTZ"
            constraints: "DEFAULT NOW()"

      dim_industry:
        grain: "1 record per industry"
        columns:
          industry_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          industry_code:
            type: "TEXT"
            constraints: "UNIQUE NOT NULL"
          industry_name:
            type: "TEXT"
            constraints: ""
          update_time:
            type: "TIMESTAMPTZ"
            constraints: ""
          created_time:
            type: "TIMESTAMPTZ"
            constraints: "DEFAULT NOW()"

      dim_company:
        grain: "1 record per company (SCD2)"
        columns:
          company_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          symbol:
            type: "TEXT"
            constraints: "UNIQUE NOT NULL"
          company_name:
            type: "TEXT"
            constraints: ""
          market_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_market_type(market_key)"
          industry_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_industry(industry_key)"
          profile_json:
            type: "JSONB"
            constraints: ""
          effective_from:
            type: "DATE"
            constraints: ""
          effective_to:
            type: "DATE"
            constraints: ""
          is_current:
            type: "BOOLEAN"
            constraints: "DEFAULT TRUE"
          created_time:
            type: "TIMESTAMPTZ"
            constraints: "DEFAULT NOW()"

      dim_report_type:
        grain: "annually or Quarterly"
        columns:
          report_type_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          report_type_code:
            type: "TEXT"
            constraints: "NOT NULL"
          description:
            type: "TEXT"
            constraints: ""

    facts:
      fact_trade:
        grain: "1 record per trade tick"
        partitions: "RANGE (trade_date_key) monthly"
        columns:
          trade_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          trade_datetime:
            type: "TIMESTAMPTZ"
            constraints: "NOT NULL"
          trade_date_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_date(date_key)"
          company_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_company(company_key)"
          price:
            type: "NUMERIC"
            constraints: ""
          volume:
            type: "BIGINT"
            constraints: ""
          value:
            type: "NUMERIC"
            constraints: ""
          side:
            type: "TEXT"
            constraints: ""
          source_json:
            type: "JSONB"
            constraints: ""

      fact_match_detail:
        grain: "1 record per match event"
        columns:
          match_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          company_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_company(company_key)"
          match_datetime:
            type: "TIMESTAMPTZ"
            constraints: ""
          price:
            type: "NUMERIC"
            constraints: ""
          volume:
            type: "BIGINT"
            constraints: ""
          broker:
            type: "TEXT"
            constraints: ""
          source_json:
            type: "JSONB"
            constraints: ""

      fact_income_statement:
        grain: "company × period (Y or Q)"
        columns:
          income_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          company_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_company(company_key)"
          report_type_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_report_type(report_type_key)"
          period_date_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_date(date_key)"
          revenue:
            type: "NUMERIC"
            constraints: ""
          operating_profit:
            type: "NUMERIC"
            constraints: ""
          net_income:
            type: "NUMERIC"
            constraints: ""
          eps:
            type: "NUMERIC"
            constraints: ""
          source_json:
            type: "JSONB"
            constraints: ""

      fact_balance_sheet:
        grain: "company × period (Y or Q)"
        columns:
          bs_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          company_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_company(company_key)"
          report_type_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_report_type(report_type_key)"
          period_date_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_date(date_key)"
          total_assets:
            type: "NUMERIC"
            constraints: ""
          total_liabilities:
            type: "NUMERIC"
            constraints: ""
          shareholder_equity:
            type: "NUMERIC"
            constraints: ""
          cash:
            type: "NUMERIC"
            constraints: ""
          inventory:
            type: "NUMERIC"
            constraints: ""
          source_json:
            type: "JSONB"
            constraints: ""

      fact_business_plan:
        grain: "company × year plan"
        columns:
          plan_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          company_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_company(company_key)"
          year_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_date(date_key)"
          target_revenue:
            type: "NUMERIC"
            constraints: ""
          target_profit:
            type: "NUMERIC"
            constraints: ""
          capex_plan:
            type: "NUMERIC"
            constraints: ""
          source_json:
            type: "JSONB"
            constraints: ""

      fact_financial_metrics:
        grain: "company × period"
        columns:
          metric_key:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          company_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_company(company_key)"
          period_date_key:
            type: "VARCHAR(32)"
            constraints: "REFERENCES dim_date(date_key)"
          pe:
            type: "NUMERIC"
            constraints: ""
          roe:
            type: "NUMERIC"
            constraints: ""
          roa:
            type: "NUMERIC"
            constraints: ""
          debt_equity:
            type: "NUMERIC"
            constraints: ""
          market_cap:
            type: "NUMERIC"
            constraints: ""
          source_json:
            type: "JSONB"
            constraints: ""

    staging:
      stg_list_stock:
        columns:
          symbol: "TEXT"
          raw_json: "JSONB"
          extracted_at: "TIMESTAMPTZ"
      stg_industry_info:
        columns:
          industry_metric: "TEXT"
          raw_json: "JSONB"
          extracted_at: "TIMESTAMPTZ"
      stg_stock_info:
        columns:
          symbol: "TEXT"
          raw_json: "JSONB"
          extracted_at: "TIMESTAMPTZ"
      stg_financial_info:
        columns:
          symbol: "TEXT"
          raw_json: "JSONB"
          extracted_at: "TIMESTAMPTZ"
      stg_trading_data:
        columns:
          symbol: "TEXT"
          raw_json: "JSONB"
          extracted_at: "TIMESTAMPTZ"
      stg_income_statement:
        columns:
          symbol: "TEXT"
          report_type: "TEXT"
          raw_json: "JSONB"
          extracted_at: "TIMESTAMPTZ"
      stg_balance_sheet:
        columns:
          symbol: "TEXT"
          report_type: "TEXT"
          raw_json: "JSONB"
      stg_match_details:
        columns:
          symbol: "TEXT"
          raw_json: "JSONB"
      stg_business_plan:
        columns:
          symbol: "TEXT"
          raw_json: "JSONB"
      stg_financial_summary:
        columns:
          symbol: "TEXT"
          raw_json: "JSONB"

    metadata:
      meta_etl_run:
        columns:
          run_id:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          job_name:
            type: "TEXT"
          start_time:
            type: "TIMESTAMPTZ"
          end_time:
            type: "TIMESTAMPTZ"
          status:
            type: "TEXT"

      meta_etl_error:
        columns:
          err_id:
            type: "VARCHAR(32)"
            constraints: "PRIMARY KEY"
          run_id:
            type: "VARCHAR(32)"
            constraints: "REFERENCES meta_etl_run(run_id)"
          error_message:
            type: "TEXT"
          raw_json:
            type: "JSONB"
          err_time:
            type: "TIMESTAMPTZ"
            constraints: "DEFAULT NOW()"

      meta_surrogate_map:
        columns:
          natural_key:
            type: "TEXT"
          surrogate_key:
            type: "VARCHAR(32)"
          type:
            type: "TEXT"
          valid_from:
            type: "DATE"
          valid_to:
            type: "DATE"

      meta_data_quality:
        columns:
          table_name:
            type: "TEXT"
          check_name:
            type: "TEXT"
          status:
            type: "TEXT"
          checked_at:
            type: "TIMESTAMPTZ"
          failed_rows:
            type: "INT"