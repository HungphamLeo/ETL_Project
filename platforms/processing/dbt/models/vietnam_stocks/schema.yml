version: 2

models:
  - name: fct_bs_assets
    description: Balance Sheet - Assets wide table (annual + quarterly) pivoted from fact_balance_sheet.
    columns:
      - name: symbol
        description: Stock symbol.
        data_tests: [not_null]
      - name: time_report_type
        description: Report frequency/type (e.g., ANNUAL/QUARTERLY or your own codes).
        data_tests: [not_null]
      - name: year
        description: Fiscal year.
        data_tests: [not_null]
      - name: period
        description: Quarter code for quarterly reports; null for annual snapshots.
      - name: total_assets
        description: Total assets.
        data_tests: [not_null]

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, time_report_type, year, period]

  - name: fct_bs_interbank_placements_loans
    description: Balance Sheet - Details of interbank placements and loans.
    columns:
