  - name: fct_is_core_income_expense
    description: >
      Income Statement - Core Income & Expense section.
      Wide table pivoted from fact_income_statement (quarterly & annual).
    columns:
      - name: symbol
        description: Stock symbol.
        data_tests: [not_null]

      - name: time_report_type
        description: Report frequency (ANNUAL / QUARTERLY).
        data_tests: [not_null]

      - name: year
        description: Fiscal year.
        data_tests: [not_null]

      - name: period
        description: Quarter identifier (Q1–Q4) or NULL for annual reports.

      - name: net_interest_income
        description: Net interest income.

      - name: interest_and_similar_income
        description: Interest and similar income.

      - name: interest_and_similar_expenses
        description: Interest and similar expenses.

      - name: net_fee_commission_income
        description: Net fee and commission income.

      - name: fee_commission_income
        description: Fee and commission income.

      - name: net_fee_and_commission_income
        description: Net fee and commission income (alternative metric code).

      - name: fee_commission_expenses
        description: Fee and commission expenses.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, time_report_type, year, period]

  - name: fct_is_financial_trading
    description: >
      Income Statement - Financial trading activities.
    columns:
      - name: symbol
        data_tests: [not_null]

      - name: time_report_type
        data_tests: [not_null]

      - name: year
        data_tests: [not_null]

      - name: period

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, time_report_type, year, period]

  - name: fct_is_other_operating
    description: >
      Income Statement - Other operating activities.
    columns:
      - name: symbol
        data_tests: [not_null]

      - name: time_report_type
        data_tests: [not_null]

      - name: year
        data_tests: [not_null]

      - name: period

      - name: net_other_operational_income
        description: Net other operating income.

      - name: other_operating_income
        description: Other operating income.

      - name: other_operating_expenses
        description: Other operating expenses.

      - name: income_from_equity_investments
        description: Income from equity investments.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, time_report_type, year, period]

  - name: fct_is_expense_profit
    description: >
      Income Statement - Expenses and profit section.
    columns:
      - name: symbol
        data_tests: [not_null]

      - name: time_report_type
        data_tests: [not_null]

      - name: year
        data_tests: [not_null]

      - name: period

      - name: profit_before_tax
        description: Profit before tax.

      - name: profit_after_tax
        description: Profit after tax.

      - name: net_profit_attributable_to_parent
        description: Net profit attributable to parent shareholders.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, time_report_type, year, period]
