name: my_dbt_project
version: "1.0.0"

config-version: 2

profile: my_dbt_project

# ============================
# Paths
# ============================
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ============================
# Models config
# ============================
models:
  my_dbt_project:

    vietnam_stocks:

      staging:
        +schema: stg
        +materialized: view

      marts:
        +schema: dw
        +materialized: table
