metadata_repo:
  msg_templates:
    run_start: "[RUN START] run_id={run_id} | job={job_name} | layer={layer} | table={table_name}"
    run_not_found: "[RUN END] Run {run_id} not found"
    run_end: "[RUN END] run_id={run_id} | status={status} | duration={duration:.1f}s | rows_read={rows_read} | rows_written={rows_written}"
    error_logged: "[ERROR] {message} | run_id={run_id} | job={job_name} | record_id={record_id}"
    fatal_escalation: "FATAL ERROR ESCALATION | run_id={run_id} | job={job_name} | {message}"
    quality_logged: "[QUALITY] {table_name}.{check_name}: {status} ({pass_rate_pct:.1f}% pass rate)"
    lineage_logged: "[LINEAGE] {source_layer}.{source_table} -> {target_layer}.{target_table} | op={operation} | rows={rows_affected}"
    persist_skip: "Cannot persist: in_memory mode or no backend configured"
    persist_start: "[PERSIST] Writing metadata to Delta Lake..."
    persist_end: "[PERSIST] Metadata persisted successfully"
  summary_templates:
    header: "\n======================================================================\n  ETL Run Summary: {run_id}\n======================================================================"
    body: "  Job:           {job_name}\n  Layer:         {layer} -> {table_name}\n  Status:        {status}\n  Start:         {start_time}\n  End:           {end_time}\n  Duration:      {duration}\n  Rows Read:     {rows_read}\n  Rows Written:  {rows_written}"
    errors_header: "\n  Errors ({total_errors} total, {fatal_errors} FATAL):"
    error_item: "    [{level}] {message} (record_id={record_id})"
    quality_header: "\n  Quality Checks ({total_checks} total, {failed_checks} FAIL/WARN):"
    quality_item: "    [{status}] {check_name} on {table_name} ({pass_rate_pct:.1f}% pass)"
    lineage_header: "\n  Data Lineage ({total_lineage} transformations):"
    lineage_item: "    {source_layer}.{source_table} --[{operation}]--> {target_layer}.{target_table} ({rows_affected} rows)"
    footer: "======================================================================\n"
  schemas:
    escalation:
      escalation_id: "escalation_id"
      error_id: "error_id"
      run_id: "run_id"
      severity: "severity"
      action_taken: "action_taken"
      escalated_at: "escalated_at"
      response_status: "response_status"
    quality:
      quality_id: "quality_id"
      run_id: "run_id"
      table_name: "table_name"
      check_name: "check_name"
      status: "status"
      total_records: "total_records"
      failed_records: "failed_records"
      pass_rate: "pass_rate"
      checked_at: "checked_at"
    lineage:
      lineage_id: "lineage_id"
      run_id: "run_id"
      source_layer: "source_layer"
      source_table: "source_table"
      target_layer: "target_layer"
      target_table: "target_table"
      operation: "operation"
      rows_affected: "rows_affected"
      recorded_at: "recorded_at"