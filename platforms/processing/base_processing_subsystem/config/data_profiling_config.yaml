data_profiling:
  null_pct_fail_threshold: 0.5
  null_pct_warn_threshold: 0.1
  hash_id_length: 16
  sample_size: 3
  null_pct_precision: 4
  constant_column_unique_count: 1
  constant_column_min_total_rows: 10
  hash_check_id: true
  high_null_msg_template: "HIGH NULL RATE: {column_name} = {null_pct:.1%}"
  const_col_msg_template: "CONSTANT COLUMN: {column_name}"
  quality_record_schema:
    check_id: "{run_id}|{table_name}|{column_name}|null_check"
    run_id: "{run_id}"
    table_name: "{table_name}"
    check_name: "null_check:{column_name}"
    status: "{status}"
    failed_rows: "null_count"
    total_rows: "total_rows"
    checked_at: "{checked_at}"
    details: "null_pct={null_pct:.2%}, unique={unique_count}"

  # ── Great Expectations configuration ──────────────────────────────────────
  # Results are logged only (never block the pipeline).
  # Failures surface as WARNING logs and are stored in DataProfile.ge_results
  # for future Grafana / reporting integration.
  great_expectations:
    # Minimum proportion of non-null values required per column
    # (maps to ExpectColumnProportionOfNonNullValuesToBeBetween)
    mostly_not_null: 0.5          # 1 - null_pct_fail_threshold

    # Columns that must be fully unique (ExpectColumnValuesToBeUnique)
    check_unique_columns: []      # e.g. ["symbol", "trade_date"]

    # Per-column numeric range checks (ExpectColumnValuesToBeBetween)
    # Add entries per dataset as needed, e.g.:
    # numeric_ranges:
    #   close_price:  { min: 0,    max: 1000000, mostly: 1.0 }
    #   volume:       { min: 0,    mostly: 1.0 }
    #   open_price:   { min: 0,    mostly: 1.0 }
    numeric_ranges: {}