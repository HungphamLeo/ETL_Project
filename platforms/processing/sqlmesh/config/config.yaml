gateways:
  local_duckdb:
    connection:
      type: duckdb
      database: ./stock_lakehouse.db
      # s3_endpoint phải là HOST:PORT — strip http:// bằng REGEXP_REPLACE
      pre_statements:
        - "INSTALL httpfs; LOAD httpfs;"
        - "SET s3_endpoint=REGEXP_REPLACE('{{ env_var('S3_ENDPOINT', 'localhost:9000') }}', '^https?://', '');"
        - "SET s3_access_key_id='{{ env_var('AWS_ACCESS_KEY_ID', 'minioadmin') }}';"
        - "SET s3_secret_access_key='{{ env_var('AWS_SECRET_ACCESS_KEY', 'minioadmin_secure_123@#') }}';"
        - "SET s3_use_ssl=false;"
        - "SET s3_url_style='path';"
        - "SET s3_region='us-east-1';"

default_gateway: local_duckdb

model_defaults:
  dialect: duckdb
  owner: data_engineering_team
