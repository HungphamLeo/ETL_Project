environment:
  staging: false
  production: false
  local: true

project_params:
  name: cophieu68
  url: "https://cophieu68.vn"
  version: 1.0
  service_name: data-api-go
  description: "ELT pipeline config: ingest raw HTML/JSON, persist to MongoDB, transform, load to PostgreSQL"
  logger:
    level: INFO
    environment: local # local | staging | production
    formatters:
      json:
        format: '{"time":"%(asctime)s", "level":"%(levelname)s", "name":"%(name)s", "message":"%(message)s", "caller":"%(pathname)s:%(lineno)d"}'
        datefmt: "%Y-%m-%dT%H:%M:%S"
      console:
        format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    format: json
    retention_days: 14
    ingestion_log:
      cophieu68:
        level: INFO
        extract:
          level: INFO
          storage_path: shared/logger/logger_ingestion/cophieu68
          max_size_mb: 50
          backup_count: 7
          files:
            debug: extract_debug.log
            info: extract_info.log
            warning: extract_warning.log
            error: extract_error.log
        load:
          level: INFO
          storage_path: shared/logger/logger_ingestion/cophieu68
          max_size_mb: 50
          backup_count: 7
          files:
            debug: load_debug.log
            info: load_info.log
            warning: load_warning.log
            error: load_error.log
        transform:
          level: INFO
          storage_path: shared/logger/logger_ingestion/cophieu68
          max_size_mb: 50
          backup_count: 7
          files:
            debug: transform_debug.log
            info: transform_info.log
            warning: transform_warning.log
            error: transform_error.log

    storage_log:
      mongodb:
        level: INFO
        storage_path: shared/logger/logger_storage/mongodb
        max_size_mb: 50
        backup_count: 7
        files:
          debug: mongodb_debug.log
          info: mongodb_info.log
          warning: mongodb_warning.log
          error: mongodb_error.log
      postgresql:
        level: INFO
        storage_path: shared/logger/logger_storage/postgresql
        max_size_mb: 50
        backup_count: 7
        files:
          debug: postgresql_debug.log
          info: postgresql_info.log
          warning: postgresql_warning.log
          error: postgresql_error.log

    processing_log:
      polars:
        level: INFO
        storage_path: shared/logger/logger_processing/polars
        max_size_mb: 50
        backup_count: 7
        files:
          debug: polars_debug.log
          info: polars_info.log
          warning: polars_warning.log
          error: polars_error.log
      duckdb:
        level: INFO
        storage_path: shared/logger/logger_processing/duckdb
        max_size_mb: 50
        backup_count: 7
        files:
          debug: duckdb_debug.log
          info: duckdb_info.log
          warning: duckdb_warning.log
          error: duckdb_error.log
      sqlmesh:
        level: INFO
        storage_path: shared/logger/logger_processing/sqlmesh
        max_size_mb: 50
        backup_count: 7
        files:
          debug: sqlmesh_debug.log
          info: sqlmesh_info.log
          warning: sqlmesh_warning.log
          error: sqlmesh_error.log
      spark:
        level: INFO
        storage_path: shared/logger/logger_processing/spark
        max_size_mb: 50
        backup_count: 7
        files:
          debug: spark_debug.log
          info: spark_info.log
          warning: spark_warning.log
          error: spark_error.log
      dbt:
        level: INFO
        storage_path: shared/logger/logger_processing/dbt
        max_size_mb: 50
        backup_count: 7
        files:
          debug: dbt_debug.log
          info: dbt_info.log
          warning: dbt_warning.log
          error: dbt_error.log

    governance_log:
      data_quality:
        level: INFO
        storage_path: shared/logger/logger_governance/data_quality
        sla_threshold: 0.95
        max_size_mb: 50
        backup_count: 7
        files:
          debug: dq_debug.log
          info: dq_info.log
          warning: dq_warning.log
          error: dq_error.log
      metadata:
        level: INFO
        storage_path: shared/logger/logger_governance/metadata
        max_size_mb: 50
        backup_count: 7
        files:
          debug: metadata_debug.log
          info: metadata_info.log
          warning: metadata_warning.log
          error: metadata_error.log

  security:
    encryption_key_path: internal/config/encryption.key
    secrets_backend: env
    rotate_secrets_days: 30
    ssh_tunnel: false

  http:
    delay_seconds: 0.3
    timeout_seconds: 30
    headers:
      User-Agent: "Mozilla/5.0 ..."
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Accept-Language: "en-US,en;q=0.5"
      Accept-Encoding: "gzip, deflate"
      Connection: "keep-alive"
      Upgrade-Insecure-Requests: "1"

  sources:
    cophieu68:
      base_url: "https://cophieu68.vn"
      endpoints:
        company_profile: "/quote/profile.php?id={symbol}"
        summary_financial: "/quote/summary.php?id={symbol}"
        financial_ratios: "/quote/financial.php?id={symbol}"
        power_rating: "/quote/summary.php?id={symbol}"
        financial_details_quarter: "/quote/financial_detail.php?id={symbol}&type=quarter"
        financial_details_year: "/quote/financial_detail.php?id={symbol}&type=year"
        market_list: "/market/markets.php"
        trading_data: "/quote/history.php?cP={page}&id={symbol}"
        stock_category:
          - "/category/category_index.php"
          - "/category/category_financial.php"
        company_industry_sector: "/market/markets.php?id={industry_code}"
        company_market_type_sector: "/market/markets.php?id={market_type_code}"
      rate_limit_per_minute: 60
      retry:
        max_attempts: 3
        backoff_seconds: 30
      parser: html
      auth: {}

