version: 1
disable_existing_loggers: false
formatters:
  default:
    format: '{"time":"%(asctime)s", "level":"%(levelname)s", "message":"%(message)s", "caller":"%(pathname)s:%(lineno)d"}'
    datefmt: "%Y-%m-%dT%H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
  file_debug:
    class: logging.handlers.RotatingFileHandler
    filename: shared/logger/logs/debug.log
    maxBytes: 10485760  # 10MB
    backupCount: 3
    formatter: default
    level: DEBUG
  file_info:
    class: logging.handlers.RotatingFileHandler
    filename: shared/logger/logs/info.log
    maxBytes: 10485760
    backupCount: 3
    formatter: default
    level: INFO
  governance_debug:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/governance/data_quality/data_quality_debug.log
    maxBytes: 10485760
    backupCount: 3
    formatter: default
    level: DEBUG
  governance_info:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/governance/data_quality/data_quality_info.log
    maxBytes: 10485760
    backupCount: 3
    formatter: default
    level: INFO
  governance_warning:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/governance/data_quality/data_quality_warning.log
    maxBytes: 10485760
    backupCount: 3
    formatter: default
    level: WARNING
  governance_error:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/governance/data_quality/data_quality_error.log
    maxBytes: 10485760
    backupCount: 3
    formatter: default
    level: ERROR

  # ── DuckDB storage logger ────────────────────────────────────────────────
  duckdb_debug:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/storage/duckdb/duckdb_debug.log
    maxBytes: 52428800  # 50MB
    backupCount: 7
    formatter: default
    level: DEBUG
  duckdb_info:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/storage/duckdb/duckdb_info.log
    maxBytes: 52428800
    backupCount: 7
    formatter: default
    level: INFO
  duckdb_warning:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/storage/duckdb/duckdb_warning.log
    maxBytes: 52428800
    backupCount: 7
    formatter: default
    level: WARNING
  duckdb_error:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/storage/duckdb/duckdb_error.log
    maxBytes: 52428800
    backupCount: 7
    formatter: default
    level: ERROR

  # ── SQLMesh processing logger ────────────────────────────────────────────
  sqlmesh_debug:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/processing/sqlmesh/sqlmesh_debug.log
    maxBytes: 52428800
    backupCount: 7
    formatter: default
    level: DEBUG
  sqlmesh_info:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/processing/sqlmesh/sqlmesh_info.log
    maxBytes: 52428800
    backupCount: 7
    formatter: default
    level: INFO
  sqlmesh_warning:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/processing/sqlmesh/sqlmesh_warning.log
    maxBytes: 52428800
    backupCount: 7
    formatter: default
    level: WARNING
  sqlmesh_error:
    class: logging.handlers.RotatingFileHandler
    filename: logger_storage/processing/sqlmesh/sqlmesh_error.log
    maxBytes: 52428800
    backupCount: 7
    formatter: default
    level: ERROR

loggers:
  etl_platforms_ingestion_cophieu68_extract:
    level: DEBUG
    handlers: [console, file_debug]
    propagate: false
  logger.governance.data_quality:
    level: INFO
    handlers: [console, governance_info, governance_warning, governance_error]
    propagate: false
  etl_platforms_processing_dbt_models:
    level: INFO
    handlers: [console, file_info]
    propagate: false

  # ── DuckDB: log SQL queries (DEBUG) + errors (WARNING+) to dedicated files
  logger.storage_log.duckdb:
    level: DEBUG
    handlers: [console, duckdb_debug, duckdb_info, duckdb_warning, duckdb_error]
    propagate: false

  # ── SQLMesh: log plan/run events + errors to dedicated files
  logger.processing_log.sqlmesh:
    level: DEBUG
    handlers: [console, sqlmesh_debug, sqlmesh_info, sqlmesh_warning, sqlmesh_error]
    propagate: false

  root:
    level: INFO
    handlers: [console]