staging: false
production: false
local: true
project_service:
  name: world_bank
  url: "https://data.worldbank.org"
  version: 1.0
  logging:
    level: "INFO"
    storage_path: "C:/Users/Admin/Downloads/Project/Github/ETL_Project/logger_storage/world_bank"
    files:
      debug: "debug.log"
      info: "info.log"
      warning: "warning.log"
      error: "error.log"
    max_size_mb: 100
    backup_count: 5
    loki_enabled: false
    loki_url: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
    service_name: "data-api-go"
    environment: "prod"
    loki_auth:
      username: "loki_user"
      password: "loki_password"
  delay: 1.0
  timeout: 30
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
    Accept-Language: "en-US,en;q=0.5"
    Accept-Encoding: "gzip, deflate"
    Connection: "keep-alive"
    Upgrade-Insecure-Requests: "1"
database:
  primary:
    host: "master-db-host"
    port: 3306
    username: "etl_user"
    password: "etl_password"
    database: "worldbank_etl"
    charset: "utf8mb4"
  read_replica:
    enabled: true
    hosts:
      - host: "replica-db-1"
        port: 3306
      - host: "replica-db-2"
        port: 3306
  ssl:
    enabled: true
    ca_cert_path: "/etc/mysql/certs/ca.pem"
    client_cert_path: "/etc/mysql/certs/client-cert.pem"
    client_key_path: "/etc/mysql/certs/client-key.pem"
encryption_key_path: "internal/config/encryption.key"
airflow:
  default_args:
    owner: "data-engineering"
    depends_on_past: false
    email_on_failure: true
    email_on_retry: false
    retries: 2
    retry_delay_sec: 300
    execution_timeout_sec: 7200
spark:
  app_name: "ETL_Pipeline"
  master: "local[*]"
  packages: []
  conf: {}
