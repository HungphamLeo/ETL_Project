services:

  # -----------------------
  # Airflow Webserver
  # -----------------------
  airflow-webserver:
    build:
      context: ..
      dockerfile: infra/docker/airflow/Dockerfile
    container_name: airflow-webserver
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow:/opt/airflow/shared:/opt/airflow/platforms:/opt/airflow/scripts
    volumes:
      - ../platforms/processing/airflow/dags:/opt/airflow/dags
      - ../shared:/opt/airflow/shared
      - ../platforms:/opt/airflow/platforms
      - ../scripts:/opt/airflow/scripts
    ports:
      - "8080:8080"
    command: standalone
    depends_on:
      - mongo-local
      - postgres-local
      - namenode
    networks:
      - etl-net

  # -----------------------
  # Airflow Scheduler
  # -----------------------
  airflow-scheduler:
    build:
      context: ..
      dockerfile: infra/docker/airflow/Dockerfile
    container_name: airflow-scheduler
    depends_on:
      - airflow-webserver
    environment:
      - PYTHONPATH=/opt/airflow:/opt/airflow/shared:/opt/airflow/platforms:/opt/airflow/scripts
    volumes:
      - ../platforms/processing/airflow/dags:/opt/airflow/dags
      - ../shared:/opt/airflow/shared
      - ../platforms:/opt/airflow/platforms
      - ../scripts:/opt/airflow/scripts
    command: scheduler
    networks:
      - etl-net

  # -----------------------
  # Prefect Server (UI)
  # -----------------------
  prefect-server:
    image: prefecthq/prefect:2-latest
    container_name: prefect-server
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    networks:
      - etl-net

  # -----------------------
  # Prefect Worker
  # -----------------------
  prefect-worker:
    build:
      context: ..
      dockerfile: infra/docker/prefect/Dockerfile
    container_name: prefect-worker
    depends_on:
      - prefect-server
      - mongo-local
      - postgres-local
      - namenode
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PYTHONPATH=/app:/app/shared:/app/platforms:/app/scripts
      - MONGO_HOST=mongo-local
      - POSTGRES_HOST=postgres-local
      - HDFS_NAMENODE=namenode
    volumes:
      - ../platforms/processing/prefect/flows:/app/flows
      - ../shared:/app/shared
      - ../platforms:/app/platforms
      - ../scripts:/app/scripts
    command: prefect worker start --type process
    networks:
      - etl-net

  # =======================================================
  #          DATABASES + HADOOP (NEW SERVICES)
  # =======================================================

  # -----------------------
  # MongoDB
  # -----------------------
  mongo-local:
    image: mongo:7.0
    container_name: mongo-local
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - etl-net

  # -----------------------
  # PostgreSQL
  # -----------------------
  postgres-local:
    image: postgres:15
    container_name: postgres-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: etl_project
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - etl-net

  # -----------------------
  # Hadoop Namenode
  # -----------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      CLUSTER_NAME: hadoop
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - etl-net

  # -----------------------
  # Hadoop Datanode
  # -----------------------
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    environment:
      CLUSTER_NAME: hadoop
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - etl-net

# =======================================================
# VOLUMES & NETWORK
# =======================================================

volumes:
  mongo_data:
  pg_data:
  hadoop_namenode:
  hadoop_datanode:

networks:
  etl-net:
