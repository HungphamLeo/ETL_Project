# version: "3.9"

services:
  # ============================
  # Prefect Server (UI + API)
  # ============================
  prefect-server:
    image: prefecthq/prefect:2-latest
    container_name: prefect-server
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4200/api/health\")' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - etl-net
    restart: always

  # ============================
  # Prefect Worker
  # ============================

  prefect-worker:
    build:
      context: ../..
      dockerfile: infra/docker/processing/prefect/Dockerfile

    container_name: prefect-worker
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /app:/app/shared:/app/platforms:/app/scripts
    volumes:
      - ../../scripts:/app/scripts
      - ../../platforms:/app/platforms
      - ../../shared:/app/shared
      - ../../platforms/processing/prefect/flows:/app/flows

    command: ["/entrypoint.sh"]
    networks:
      - etl-net
    restart: always

  kafka:
    image: apache/kafka:3.8.0
    container_name: streaming_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
    networks:
      - lakehouse_network
      - etl-net

  zookeeper:
    image: zookeeper:3.9
    container_name: streaming_zookeeper
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - lakehouse_network
      - etl-net
  # ============================
  # MongoDB
  # ============================
  mongo-local:
    image: mongo:7.0
    container_name: mongo-local
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123@#
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - etl-net
  
  jobmanager:
    image: flink:1.20.0-scala_2.12
    container_name: jobmanager
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
    command: jobmanager
    networks:
      - lakehouse_network
      - etl-net

  taskmanager:
    image: flink:1.20.0-scala_2.12
    container_name: taskmanager
    depends_on:
      - jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=2
    command: taskmanager
    networks:
      - lakehouse_network
      - etl-net

  # ============================
  # MinIO (S3-compatible storage)
  # ============================
  minio:
    image: minio/minio:latest
    container_name: minio-lakehouse
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secure_123@#
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - lakehouse_network
      - etl-net
  # ============================
  # PostgreSQL
  # ============================
  postgres-local:
    image: postgres:15
    container_name: postgres-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: etl_project
      HUNGPHAM_USER: hungpham
      HUNGPHAM_PASSWORD: hungpham@123!#
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - etl-net

  dbt:
    build:
      context: ../..
      dockerfile: infra/docker/processing/dbt/Dockerfile
    container_name: dbt
    depends_on:
      postgres-local:
        condition: service_healthy
    volumes:
      - ../../platforms/processing/dbt:/app/dbt
      - ../../infra/docker/processing/dbt/profiles.yml:/app/dbt/profiles/profiles.yml
      - ../../platforms/processing/dbt/config/dbt_project.yml:/app/dbt/dbt_project.yml
    networks:
      - etl-net

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.master.Master"
      - "--host"
      - "spark-master"
      - "--port"
      - "7077"
      - "--webui-port"
      - "8080"
    volumes:
      - ./jars:/opt/spark/custom_jars
      - ./data:/opt/spark/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"spark-master\", 7077)); s.close()' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lakehouse_network
      - etl-net

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 4g
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
      - "-c"
      - "2"
      - "-m"
      - "4g"
    volumes:
      - ./jars:/opt/spark/custom_jars
      - ./data:/opt/spark/data
    networks:
      - lakehouse_network
      - etl-net

  trino:
    image: trinodb/trino:458
    container_name: trino-query
    ports:
      - "8082:8080"
    volumes:
      - ./trino-catalog:/etc/trino/catalog
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
    networks:
      - lakehouse_network
      - etl-net
# ============================
# VOLUMES & NETWORKS
# ============================

volumes:
  mongo_data:
    driver: local
  minio_data:
    driver: local
  pg_data:
    driver: local
  prefect_data:
    driver: local

networks:
  lakehouse_network:
    driver: bridge
  etl-net:
    driver: bridge
