# version: "3.9"

services:
  # ============================
  # Prefect Server (UI + API)
  # ============================
  prefect-server:
    image: prefecthq/prefect:2-latest
    container_name: prefect-server
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - etl-net
    restart: always

  # ============================
  # Prefect Worker
  # ============================

  prefect-worker:
    build:
      context: ../..
      dockerfile: infra/docker/processing/prefect/Dockerfile

    container_name: prefect-worker
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /app:/app/shared:/app/platforms:/app/scripts
    volumes:
      - ../../scripts:/app/scripts
      - ../../platforms:/app/platforms
      - ../../shared:/app/shared
      - ../../platforms/processing/prefect/flows:/app/flows

    command: ["/entrypoint.sh"]
    networks:
      - etl-net
    restart: always

  kafka:
    image: bitnami/kafka:latest
    container_name: stock_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - lakehouse_network

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: stock_zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    restart: unless-stopped
    networks:
      - lakehouse_network
  # ============================
  # MongoDB
  # ============================
  mongo-local:
    image: mongo:7.0
    container_name: mongo-local
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - etl-net
  
  flink:
    jobmanager:
      image: flink:1.20.0-scala_2.12
      container_name: jobmanager
      ports:
        - "8081:8081"
      environment:
        - JOB_MANAGER_RPC_ADDRESS=jobmanager
      command: jobmanager

    taskmanager:
      image: flink:1.20.0-scala_2.12
      container_name: taskmanager
      depends_on:
        - jobmanager
      environment:
        - JOB_MANAGER_RPC_ADDRESS=jobmanager
        - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=2
      command: taskmanager

#===============================
  minio:
    image: minio/minio:latest
    container_name: minio-lakehouse
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secure_123@#
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - lakehouse_network
  # ============================
  # PostgreSQL
  # ============================
  postgres-local:
    image: postgres:15
    container_name: postgres-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: etl_project
      HUNGPHAM_USER: hungpham
      HUNGPHAM_PASSWORD: hungpham@123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - etl-net

  dbt:
    build:
      context: ../..
      dockerfile: infra/docker/processing/dbt/Dockerfile
    container_name: dbt
    depends_on:
      postgres-local:
        condition: service_healthy
    volumes:
      - ../../platforms/processing/dbt:/app/dbt
      - ../../infra/docker/processing/dbt/profiles.yml:/app/dbt/profiles/profiles.yml
      - ../../platforms/processing/dbt/config/dbt_project.yml:/app/dbt/dbt_project.yml
    networks:
      - etl-net

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    volumes:
      - ./jars:/opt/spark/jars
      - ./data:/opt/spark/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7077"]
      interval: 30s

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 4g
    volumes:
      - ./jars:/opt/spark/jars
      - ./data:/opt/spark/data

  trino:
    image: trinodb/trino:458
    container_name: trino-query
    ports:
      - "8082:8080"
    volumes:
      - ./trino-catalog:/etc/trino/catalog
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
# ============================
# VOLUMES & NETWORKS
# ============================

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
  prefect_data:
    driver: local

networks:
  lakehouse_network:
    driver: bridge
